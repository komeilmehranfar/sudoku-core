name: Release

# release-please opens a "chore(main): release x.y.z" PR from Conventional Commits.
# Merging that PR tags the release, creates the GitHub release, and publishes to npm.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC) — no NPM_TOKEN secret; also signs provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm publish

  # Mirror to GitHub Packages so the repo's "Packages" sidebar lists it.
  # That registry requires an owner scope; npm keeps the unscoped name.
  publish-github-packages:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@komeilmehranfar"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pkg set name=@komeilmehranfar/sudoku-core
      # Provenance is only supported on npmjs.org.
      - run: npm publish --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
