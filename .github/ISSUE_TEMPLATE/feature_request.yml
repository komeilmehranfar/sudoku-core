name: Feature request
description: Suggest a new feature, technique or API improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues first to avoid duplicates.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Solving technique
        - Difficulty rating
        - Generator
        - Hints / teaching
        - Public API / types
        - Packaging / build
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, or what use case does it enable?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like. Include a code sketch if it helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: Example board
      description: For technique or rating requests, an 81-character puzzle string where the feature applies, plus a reference (for example, a SudokuWiki or HoDoKu page).
      render: text
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
          required: false
